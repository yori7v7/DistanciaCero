<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Orb — Distancia Cero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060010;
    color: #fff5fa;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
  }

  .orb-labels {
    position: relative;
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 60px;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 8px;
    color: #ff8ad4;
    text-align: center;
  }
  p.sub {
    color: #d4b8c8;
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 24px;
  }
  .specs {
    padding: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    max-width: 550px;
    text-align: left;
  }
  .specs code {
    display: block;
    font-size: 0.75rem;
    color: #d4b8c8;
    line-height: 1.8;
  }
</style>
</head>
<body>

<!-- The orbs -->
<div class="glow-orb w-[500px] h-[500px] bg-pink top-1/4 -left-32" style="width:500px; height:500px; background:#ff8ad4; top:20%; left:-60px;"></div>
<div class="glow-orb w-[400px] h-[400px] bg-red top-1/3 -right-24" style="width:400px; height:400px; background:#ff2d55; top:40%; right:-80px;"></div>
<div class="glow-orb w-[300px] h-[300px] bg-pink-soft bottom-1/4 left-1/3 opacity-10" style="width:300px; height:300px; background:#ffc4e8; bottom:20%; left:35%; opacity:0.08;"></div>

<div class="orb-labels">
  <h2>🔮 Glow Orb</h2>
  <p class="sub">Ambient background orbs — decorative, non-interactive</p>
  <div class="specs">
    <code>position: absolute + border-radius: 50%</code>
    <code>filter: blur(80px) — soft, ethereal</code>
    <code>opacity: 0.15 (subtle, doesn't distract)</code>
    <code>Colors: pink (#ff8ad4), red (#ff2d55), pink-soft (#ffc4e8)</code>
    <code>Used in: Hero, Landing, Universe sections</code>
  </div>
</div>

</body>
</html>
