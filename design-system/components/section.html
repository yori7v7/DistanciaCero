<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section — Distancia Cero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060010;
    color: #fff5fa;
    padding: 20px;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 24px;
    color: #ff8ad4;
    text-align: center;
  }

  .section-demo {
    width: min(100% - 32px, 1120px);
    margin: 0 auto;
    padding: 40px 0;
    border: 2px dashed rgba(255,138,212,0.2);
    border-radius: 16px;
    position: relative;
  }
  .section-demo::before {
    content: '.section container';
    position: absolute;
    top: -10px;
    left: 20px;
    background: #060010;
    padding: 2px 12px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: rgba(255,138,212,0.5);
  }
  .section-content {
    display: flex; gap: 16px; flex-wrap: wrap; padding: 0 16px;
  }
  .section-content > div {
    flex: 1; min-width: 150px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .section-content h4 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: #ff8ad4;
  }
  .section-content p {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
  }

  .specs {
    margin: 32px auto 0;
    padding: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    max-width: 550px;
  }
  .specs code {
    display: block;
    font-size: 0.75rem;
    color: #d4b8c8;
    line-height: 1.8;
  }
  .responsive-bar {
    display: flex; gap: 8px; margin: 20px auto 0; max-width: 550px;
    justify-content: center;
  }
  .responsive-bar span {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.65rem;
    font-weight: 700;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<h2>📐 Section Container</h2>

<div class="section-demo">
  <div class="section-content">
    <div><h4>Contenido</h4><p>Se adapta al ancho</p></div>
    <div><h4>Padding</h4><p>80px vertical</p></div>
    <div><h4>Centrado</h4><p>Auto margins</p></div>
  </div>
</div>

<div class="responsive-bar">
  <span>32px gutter</span>
  <span>→</span>
  <span>1120px max-width</span>
  <span>→</span>
  <span>Responsive</span>
</div>

<div class="specs">
  <code>width: min(100% - 32px, 1120px)</code>
  <code>margin: 0 auto — always centered</code>
  <code>padding: 80px 0 — consistent vertical rhythm</code>
  <code>All main sections use this wrapper</code>
</div>

</body>
</html>
