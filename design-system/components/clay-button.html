<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clay Button — Distancia Cero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(circle at center, rgba(255,122,200,0.12), transparent 30%), #060010;
    color: #fff5fa;
    padding: 60px;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 28px;
    color: #ff8ad4;
    text-align: center;
  }

  .clay-button {
    position: relative;
    top: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: rgba(18, 4, 28, 0.82);
    border: 1.5px solid rgba(255, 138, 212, 0.28);
    border-radius: 999px;
    color: #fff5fa;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    box-shadow:
      0 4px 0 rgba(160, 20, 60, 0.2),
      0 6px 12px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
  }
  .clay-button:hover {
    box-shadow:
      0 5px 0 rgba(160, 20, 60, 0.25),
      0 8px 16px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
    background: rgba(24, 6, 34, 0.88);
  }
  .clay-button:active,
  .clay-pressed {
    top: 3px;
    box-shadow:
      0 1px 0 rgba(160, 20, 60, 0.15),
      0 2px 4px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
  }

  .states { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .state-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .state-label {
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: rgba(255,255,255,0.35);
  }
  .specs {
    margin-top: 32px;
    padding: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    max-width: 600px;
  }
  .specs code {
    display: block;
    font-size: 0.75rem;
    color: #d4b8c8;
    line-height: 1.8;
  }
</style>
</head>
<body>

<h2>🔘 Clay Button</h2>

<div class="states">
  <div class="state-group">
    <button class="clay-button" style="pointer-events:none">
      ♥ Entrar al universo
    </button>
    <span class="state-label">Default</span>
  </div>
  <div class="state-group">
    <button class="clay-button" style="pointer-events:none; background:rgba(24,6,34,0.88); box-shadow: 0 5px 0 rgba(160,20,60,0.25), 0 8px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.14);">
      ♥ Entrar al universo
    </button>
    <span class="state-label">Hover</span>
  </div>
  <div class="state-group">
    <button class="clay-button clay-pressed" style="pointer-events:none; top:3px;">
      ♥ Entrar al universo
    </button>
    <span class="state-label">Pressed</span>
  </div>
</div>

<div class="specs">
  <code>background: rgba(18, 4, 28, 0.82) — bg-glass-strong</code>
  <code>border: 1.5px solid rgba(255, 138, 212, 0.28) — border-glow</code>
  <code>border-radius: 999px — radius-full (pill shape)</code>
  <code>Press: top moves 3px down, shadow compresses</code>
  <code>transition: all 0.12s (snappy press feel)</code>
</div>

</body>
</html>
